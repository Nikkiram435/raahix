<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account — RAAHIX</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <main class="auth-wrap">

        <a href="index.html" class="auth-brand">
            <div class="brand-icon">✦</div>
            <span>RAAHIX</span>
        </a>

        <div class="auth-card">
            <h1>Create your account</h1>
            <p class="page-sub">Plan less. Travel more.</p>

            <form id="authForm" data-mode="register" novalidate>
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" autocomplete="name" maxlength="40" placeholder="Your name">
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="new-password" placeholder="At least 8 characters">
                </div>

                <div class="field">
                    <label for="confirm">Confirm password</label>
                    <input type="password" id="confirm" autocomplete="new-password" placeholder="Type it again">
                </div>

                <p class="form-message" id="authMsg" role="status"></p>

                <button type="submit" class="btn-primary">Create account</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
            <p class="auth-demo">Your password is encrypted and never stored in plain text.</p>
        </div>

    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
