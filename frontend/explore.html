<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore — RAAHIX</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="sidebar"></div>

    <main class="main-content">
        <section class="content-area">

            <div class="page-head">
                <div>
                    <h1>Explore</h1>
                    <p class="page-sub" id="exploreSub"></p>
                </div>
            </div>

            <form class="explore-bar" id="cityForm">
                <input type="text" id="cityInput" class="search-input" list="cityList" maxlength="80"
                       placeholder="City (e.g. Goa, Jaipur, Udaipur)" aria-label="City">
                <datalist id="cityList">
                    <option value="Mumbai"><option value="Delhi"><option value="Goa"><option value="Jaipur">
                    <option value="Udaipur"><option value="Manali"><option value="Kerala"><option value="Bengaluru">
                    <option value="Kolkata"><option value="Chennai"><option value="Rishikesh"><option value="Varanasi">
                    <option value="Shimla"><option value="Hyderabad">
                </datalist>
                <button type="submit" class="btn-primary city-go">Search</button>
            </form>

            <input type="search" id="searchInput" class="search-input filter-input"
                   placeholder="Filter the places below by name..." aria-label="Filter results by name">

            <div class="tabs" id="categoryTabs">
                <button class="tab active" data-cat="All">For you</button>
                <button class="tab" data-cat="Experiences">Experiences</button>
                <button class="tab" data-cat="Restaurants">Restaurants</button>
                <button class="tab" data-cat="Stays">Stays</button>
                <button class="tab" data-cat="Locations">Locations</button>
            </div>

            <p class="result-count" id="resultCount" role="status"></p>
            <div class="place-grid" id="placeGrid"></div>
            <p class="list-note" id="listStatus" role="status"></p>
            <div id="sentinel" class="sentinel"></div>
            <p class="attribution">Place data © OpenStreetMap contributors, via Geoapify.</p>

        </section>
    </main>

    <script src="js/sidebar.js"></script>
    <script src="js/api.js"></script>
    <script src="js/places-data.js"></script>
    <script src="js/explore.js"></script>
</body>
</html>
