<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — RAAHIX</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <main class="auth-wrap">

        <a href="index.html" class="auth-brand">
            <div class="brand-icon">✦</div>
            <span>RAAHIX</span>
        </a>

        <div class="auth-card">
            <h1>Welcome back</h1>
            <p class="page-sub">Log in to see your trips.</p>

            <form id="authForm" data-mode="login" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="current-password" placeholder="Your password">
                </div>

                <p class="form-message" id="authMsg" role="status"></p>

                <button type="submit" class="btn-primary">Log in</button>
            </form>

            <p class="auth-switch">New to RAAHIX? <a href="register.html">Create an account</a></p>
            <p class="auth-demo">Your password is encrypted and never stored in plain text.</p>
        </div>

    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
